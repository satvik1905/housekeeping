<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monarch Resort — Housekeeping Sheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --navy: #2B3445;
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --ink: #1D2330;
  --muted: #6B7385;
  --line: #DCE0E7;
  --co: #9A4B2F;      /* checkout */
  --co-bg: #F6E7E0;
  --so: #2F5E86;      /* stayover */
  --so-bg: #E2ECF5;
  --rs: #6A4A8C;
  --rs-bg: #ECE4F4;
  --focus: #2F5E86;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #12151C;
    --surface: #1B1F29;
    --ink: #E8EAF0;
    --muted: #9AA1B2;
    --line: #2E3443;
    --co: #E8A488;
    --co-bg: #3A2620;
    --so: #8DB8DE;
    --so-bg: #1F2D3B;
    --rs: #C4A8E2;
    --rs-bg: #2C2238;
    --focus: #8DB8DE;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { height: 34px; width: auto; }
@media (prefers-color-scheme: dark) { .logo { filter: invert(1) brightness(1.6) grayscale(1); } }
.date { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.date label { font-size: 13px; color: var(--muted); }
.date input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); min-height: 44px; }
.date-pretty { font-weight: 600; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 18px; min-height: 44px; cursor: pointer; font-weight: 600; }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-primary { background: #E8EAF0; border-color: #E8EAF0; color: #1B1F29; } }
.btn:disabled { opacity: .45; cursor: not-allowed; }

main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
h2 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
section + section { margin-top: 36px; }

/* ---------- staff ---------- */
.staff { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 500; }
.chip .order { display: none; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; }
@media (prefers-color-scheme: dark) { .chip .order { background: #E8EAF0; color: #1B1F29; } }
.chip[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
@media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { border-color: #E8EAF0; box-shadow: inset 0 0 0 1px #E8EAF0; } }
.chip[aria-pressed="true"] .order { display: inline-flex; }

/* ---------- rooms ---------- */
.floor { margin-top: 18px; }
.floor h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.room { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 104px; display: flex; flex-direction: column; }
.room-main { flex: 1; text-align: left; border: 0; background: transparent; padding: 10px 12px 8px; cursor: pointer; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; }
.room-num { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.room-type { font-size: 12px; color: var(--muted); line-height: 1.3; }
.room-status { margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.room[data-status="co"] { background: var(--co-bg); border-color: var(--co); }
.room[data-status="co"] .room-status { color: var(--co); }
.room[data-status="so"] { background: var(--so-bg); border-color: var(--so); }
.room[data-status="so"] .room-status { color: var(--so); }
.room[data-status="sors"] { background: var(--rs-bg); border-color: var(--rs); }
.room[data-status="sors"] .room-status { color: var(--rs); }

/* ---------- mode switch ---------- */
.modes { max-width: 1180px; margin: 0 auto; padding: 0 20px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.modes-label { font-size: 13px; color: var(--muted); margin-right: 4px; }
.mode { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.mode .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mode[data-mode="co"] .dot { background: var(--co); }
.mode[data-mode="so"] .dot { background: var(--so); }
.mode[data-mode="sors"] .dot { background: var(--rs); }
.mode[data-mode="co"][aria-pressed="true"] { background: var(--co-bg); border-color: var(--co); color: var(--co); }
.mode[data-mode="so"][aria-pressed="true"] { background: var(--so-bg); border-color: var(--so); color: var(--so); }
.mode[data-mode="sors"][aria-pressed="true"] { background: var(--rs-bg); border-color: var(--rs); color: var(--rs); }

@media (max-width: 640px) {
  .bar-inner { gap: 10px; padding: 10px 14px; }
  .date { margin-left: 0; width: 100%; }
  .actions { width: 100%; display: flex; gap: 10px; }
  .actions .btn { flex: 1; }
  .modes { padding: 0 14px 10px; gap: 6px; }
  .modes-label { width: 100%; }
  .mode { flex: 1; justify-content: center; padding: 8px 8px; font-size: 14px; }
  main { padding: 18px 14px 48px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
}
.actions { display: flex; gap: 10px; }

/* ---------- print sheets (hidden on screen) ---------- */
#sheets { display: none; }

@page { size: letter portrait; margin: 0.5in; }
@media print {
  :root { color-scheme: light; padding: 0; }
  body { background: #fff; color: #1F1F1F; font-family: Helvetica, Arial, sans-serif; }
  body::before, .bar, main { display: none !important; }
  #sheets { display: block; }
}
.page { width: 7.5in; height: 10in; position: relative; break-after: page; page-break-after: always; overflow: hidden; color: #1F1F1F; font-family: Helvetica, Arial, sans-serif; }
.page:last-child { break-after: auto; page-break-after: auto; }
.p-logo { display: block; width: 210pt; margin: 0 auto; }
.p-title { text-align: center; font-weight: 700; font-size: 16pt; margin: 10pt 0 0; line-height: 1; }
.p-fields { display: flex; gap: 20pt; margin-top: 14pt; font-size: 9pt; font-weight: 700; align-items: flex-end; }
.p-field { display: flex; align-items: flex-end; gap: 6pt; }
.p-field .val { border-bottom: 0.6pt solid #1F1F1F; padding: 0 4pt 1pt; font-weight: 400; font-size: 10pt; min-height: 13pt; }
.p-field.date .val { width: 146pt; }
.p-field.hk { flex: 1; }
.p-field.hk .val { flex: 1; }
table.p-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 14pt; }
.p-table th { background: #F2F0EB; height: 36pt; font-size: 7.6pt; font-weight: 700; text-transform: uppercase; border: 0.5pt solid #D6D4CE; border-top: 0.9pt solid #1F1F1F; border-bottom: 0.9pt solid #1F1F1F; padding: 0 2pt; line-height: 1.25; }
.p-table th span { display: block; white-space: nowrap; letter-spacing: -0.1pt; font-size: 6.3pt; font-weight: 400; font-style: italic; color: #8A8A85; text-transform: none; }
.p-table td { height: 17.4pt; border: 0.5pt solid #D6D4CE; padding: 0 4pt; font-size: 7pt; vertical-align: middle; }
.p-table tr:nth-child(even) td { background: #FAF9F6; }
.p-table tr:last-child td { border-bottom: 0.9pt solid #1F1F1F; }
.p-table td.num { text-align: center; font-weight: 700; font-size: 9.5pt; }
.p-table td.bt { font-weight: 700; line-height: 1.05; }
.p-table td.x { text-align: center; font-size: 10pt; font-weight: 700; }
.p-table td.cm { font-size: 8pt; }
.p-table .o { display: inline-block; width: 8pt; height: 8pt; border: 1.3pt solid #1F1F1F; border-radius: 50%; vertical-align: middle; }
.p-note { text-align: center; font-style: italic; font-size: 9pt; margin-top: 16pt; }
.p-check-h { font-size: 9pt; font-weight: 700; border-bottom: 0.6pt solid #1F1F1F; padding-bottom: 4pt; margin-top: 14pt; }
.p-check { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10pt; font-size: 8.5pt; }
.p-check div div { display: flex; align-items: flex-end; gap: 6pt; height: 15pt; }
.p-check .blank { width: 24pt; border-bottom: 0.6pt solid #1F1F1F; flex: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const STAFF = ["Maria", "Mari", "Mabel", "Isabel", "Peya", "Berta", "Eloy", "Jose", "Ivan"];

const TYPES = {
  "Queen Room w/ Fireplace": [101,102,108,124,125,202,205,208,221,230],
  "King w/ Fireplace": [107,110,113,121,122,201,204,207,210,213,222,224,225,227,228,229,231],
  "Two Queen Beds": [111,117,118,119,211,217,218,219,223],
  "Two Queen Beds w/ Fireplace": [105,114,115,116,214,215,216,226],
  "King Bed": [112,123,212,220,232],
  "Kitchenette": [109,203,206,209],
  "Handicap Double": [120],
  "Handicap King Fireplace": [104],
};
const ROOMS = Object.entries(TYPES).flatMap(([t, rs]) => rs.map(n => ({ n, t }))).sort((a, b) => a.n - b.n);

const CHECKLIST = [
  ["Check drawers", "Check closets", "Check lights", "Close windows", "Turn off heater", "Turn off TV alarm"],
  ["Elevator", "Public restroom", "Lobby (also windows)", "Coffee area", "Kitchen", "Vacuum all hallways"],
  ["Office restroom", "Vacuum office carpet", "Poolside furniture", "Sweep entryway", "Clean windows", "Check phones"],
];

const KEY = "monarch-hk-draft";
const LABEL = { "": "Not marked", co: "Checkout", so: "Stayover", sors: "Stayover + Room service" };
let mode = "co";

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function prettyDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const wd = dt.toLocaleDateString("en-US", { weekday: "long" });
  const mo = dt.toLocaleDateString("en-US", { month: "short" });
  return `${wd} ${mo} ${d}, ${y}`;
}

function blank() { return { date: todayISO(), status: {}, staff: [] }; }
let state = blank();
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && typeof saved === "object") {
    state = Object.assign(blank(), saved);
    if (saved.rs) { for (const n in saved.rs) if (state.status[n] === "so") state.status[n] = "sors"; delete state.rs; }
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const $ = id => document.getElementById(id);

function renderDate() {
  $("date").value = state.date;
  $("datePretty").textContent = prettyDate(state.date);
}

function renderStaff() {
  const wrap = $("staff");
  wrap.innerHTML = "";
  STAFF.forEach(name => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    const idx = state.staff.indexOf(name);
    b.setAttribute("aria-pressed", idx > -1 ? "true" : "false");
    b.innerHTML = `<span class="order">${idx > -1 ? idx + 1 : ""}</span>${name}`;
    b.addEventListener("click", () => {
      const i = state.staff.indexOf(name);
      if (i > -1) state.staff.splice(i, 1); else state.staff.push(name);
      save(); renderStaff(); renderPrintState();
    });
    wrap.appendChild(b);
  });
}

function roomTile(r) {
  const el = document.createElement("div");
  el.className = "room";
  const st = state.status[r.n] || "";
  el.dataset.status = st;
  el.dataset.room = r.n;
  const main = document.createElement("button");
  main.type = "button";
  main.className = "room-main";
  main.setAttribute("aria-label", `Room ${r.n}, ${r.t}, ${LABEL[st]}`);
  main.innerHTML = `<span class="room-num">${r.n}</span><span class="room-type">${r.t}</span><span class="room-status">${st ? LABEL[st] : ""}</span>`;
  main.addEventListener("click", () => {
    if (state.status[r.n] === mode) delete state.status[r.n]; else state.status[r.n] = mode;
    save(); el.replaceWith(roomTile(r));
    document.querySelector(`[data-room="${r.n}"] .room-main`).focus();
  });
  el.append(main);
  return el;
}

function renderModes() {
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"));
}
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; renderModes(); }));

function renderRooms() {
  $("floor1").innerHTML = ""; $("floor2").innerHTML = "";
  ROOMS.forEach(r => $(r.n < 200 ? "floor1" : "floor2").appendChild(roomTile(r)));
}

function renderPrintState() {
  const none = state.staff.length === 0;
  $("printBtn").disabled = none;
  $("staffHint").textContent = none
    ? "Pick at least one housekeeper to print."
    : "Pick who's working today. Sheets print in the order you pick them.";
}

/* ---------- sheet building ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function sheetPage(name, rooms, withChecklist) {
  const rows = rooms.map(r => {
    const st = state.status[r.n] || "";
    return `<tr>
      <td class="num">${r.n}</td>
      <td class="bt">${esc(r.t)}</td>
      <td class="x">${st === "co" ? "✗" : ""}</td>
      <td class="x">${st === "so" || st === "sors" ? '<span class="o"></span>' : ""}</td>
      <td class="cm">${st === "sors" ? "Room Service" : ""}</td>
      <td></td><td></td><td></td>
    </tr>`;
  }).join("");
  const checklist = withChecklist ? `
    <div class="p-note">Remember, no more than 40 mins per room, checkout or stayover.</div>
    <div class="p-check-h">CHECKLIST</div>
    <div class="p-check">${CHECKLIST.map(col => `<div>${col.map(i => `<div><span class="blank"></span>${esc(i)}</div>`).join("")}</div>`).join("")}</div>` : "";
  return `<div class="page">
    <img class="p-logo" src="${LOGO}" alt="">
    <div class="p-title">Housekeeping Sheet</div>
    <div class="p-fields">
      <div class="p-field date">DATE <span class="val">${esc(prettyDate(state.date))}</span></div>
      <div class="p-field hk">HOUSEKEEPER <span class="val">${esc(name)}</span></div>
    </div>
    <table class="p-table">
      <colgroup><col style="width:66pt"><col style="width:92pt"><col style="width:36pt"><col style="width:36pt"><col style="width:106pt"><col style="width:64pt"><col style="width:70pt"><col style="width:70pt"></colgroup>
      <thead><tr>
        <th>Room Number<span>Número de habitación</span></th>
        <th>Bed Type<span>Tipo de cama</span></th>
        <th>C/O</th><th>S/O</th>
        <th>Comment<span>Comentarios</span></th>
        <th>Check Room<span>Revisar habitación</span></th>
        <th>Cleaned By<span>Limpiado por</span></th>
        <th>Inspected By<span>Inspeccionado por</span></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${checklist}
  </div>`;
}

function buildSheets() {
  const f1 = ROOMS.filter(r => r.n < 200), f2 = ROOMS.filter(r => r.n >= 200);
  $("sheets").innerHTML = state.staff.map(name => sheetPage(name, f1, true) + sheetPage(name, f2, false)).join("");
}

/* ---------- events ---------- */
$("date").addEventListener("change", e => {
  state.date = e.target.value || todayISO();
  save(); renderDate();
});
$("printBtn").addEventListener("click", () => {
  if (!state.staff.length) return;
  buildSheets();
  window.print();
});
$("clearBtn").addEventListener("click", () => {
  if (!confirm("Clear all rooms, housekeepers and the date? This can't be undone.")) return;
  state = blank(); save(); renderAll();
});

function renderAll() { renderModes(); renderDate(); renderStaff(); renderRooms(); renderPrintState(); }
renderAll();
</script>
